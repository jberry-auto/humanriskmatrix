# The Human Risk Maturity Model. Five levels, read left to right.
# Mostly traditional security work; counter-intelligence is the sharp end at the top levels.
# Each level has a short story (posture, description, signals, example tooling, modes, degrees, an
# optional counter-intelligence note, the blind spot, and the gate to the next level) plus a track
# for each business size that can reach it. Sizes and their caps live in maturity-segments.yaml.
- level: 1
  name: Compliance Awareness
  posture: Training is a box to check.
  description: >-
    A baseline program that delivers required security training to everyone on a set schedule, to
    satisfy compliance. It produces a trained workforce on paper and the completion records an audit
    needs. It does not change behavior or reduce real risk, and success is measured by who finished
    rather than what changed.
  signals: Training completion records.
  tooling: Awareness or SAT platform, email filtering, antivirus, MFA.
  modes: [educate]
  degrees: [unintentional]
  counterIntel: null
  limitation: It tracks attendance, not risk. It cannot show whether anyone is safer.
  gate: Deliver training in context when a risky action happens, and measure behavior.
  tracks:
    - segment: small
      approach: An off-the-shelf training tool with automatic enrollment, run part time by IT or an MSP.
      practices:
        - Assign recurring awareness training.
        - Keep completion records for audits.
      question: Is everyone assigned recurring security training, with completion tracked for compliance?
    - segment: mid-size
      approach: A security team runs the program in an LMS and reports completion to risk or audit.
      practices:
        - Run a managed curriculum tied to compliance.
        - Report completion and overdue training.
      question: Does security run a documented awareness program and report completion to risk or audit?
    - segment: enterprise
      approach: A dedicated team runs an enterprise LMS with audited completion and policy sign-off.
      practices:
        - Run the program with audited evidence.
        - Tie training to onboarding and policy sign-off.
      question: Does a dedicated team run the program with audited completion and policy sign-off?
- level: 2
  name: Just-in-Time Training
  posture: Coach people at the moment of risk.
  description: >-
    The program moves from scheduled training to coaching at the point of risk. It detects risky
    actions as they happen and delivers targeted guidance and a corrective step in the moment. It
    delivers fewer everyday mistakes and faster correction, but does not yet build a lasting picture
    of each person's risk.
  signals: Live triggers from email, DLP, the browser, and endpoints. Each is handled on its own.
  tooling: Human-risk platform nudges, email security, DLP.
  modes: [educate, intervene]
  degrees: [unintentional, unaware, deceived]
  counterIntel: null
  limitation: >-
    It reacts, but it has no memory. It cannot tell a repeat offender from a one-off, or coach
    based on history.
  gate: Map the threats you face to the behaviors that drive them, and measure those behaviors over time.
  tracks:
    - segment: small
      approach: Built-in warnings from the tools already in use, plus a platform's in-the-moment tips.
      practices:
        - Turn on risky-action warnings in email and SaaS.
        - Enable platform nudges.
      question: Do risky actions trigger an in-the-moment warning or nudge for the user?
    - segment: mid-size
      approach: Security sets up contextual prompts across email and DLP, each with a way to report.
      practices:
        - Configure contextual warnings tied to policy.
        - Add a report or coaching path to each prompt.
      question: Are contextual prompts running across your main channels, each with a way to report?
    - segment: enterprise
      approach: The awareness team ties just-in-time coaching to the wider program and tunes it by role.
      practices:
        - Integrate coaching with the curriculum.
        - Tune prompts by role and risk.
      question: Is just-in-time coaching integrated with the wider program and tuned by role?
- level: 3
  name: Threat-Informed Risk Management
  posture: Manage the behaviors that drive risk.
  description: >-
    The program manages human risk through behavior. It maps the threats and risks it faces to the
    behaviors that drive them, using the Human Risk Matrix, then trains on those behaviors, measures
    them, and indexes on their reduction over time. It delivers a clear view of which behaviors
    matter most and evidence that risky behavior is falling.
  signals: Behavioral data from UEBA, DLP, identity, and access logs, mapped to the matrix, plus simulation results.
  tooling: Human-risk platform, UEBA, DLP, phishing simulation.
  modes: [educate, evaluate, monitor]
  degrees: [unintentional, unaware, deceived, coerced]
  counterIntel: Controlled testing begins here, a first overlap with counter-intelligence method.
  limitation: >-
    It sees single behaviors, not the pattern that signals intent. A determined insider hides in
    normal noise.
  gate: Move from reducing common risky behavior to finding the rare signal that points to malicious intent.
  tracks:
    - segment: small
      approach: >-
        One human-risk platform tracks behavior, maps it to the matrix, and assigns targeted
        training. The owner reviews a monthly dashboard. This is a small business's ceiling.
      practices:
        - Use a platform that scores behavior against the matrix.
        - Let it assign targeted training.
        - Review a monthly dashboard.
      question: Does a platform track behavior against the matrix and assign targeted training you review?
    - segment: mid-size
      approach: Security feeds UEBA, DLP, and identity logs into a matrix-mapped platform and runs simulations.
      practices:
        - Map behavioral signals to the matrix.
        - Run phishing and scenario simulations.
        - Review per-person and per-team risk profiles.
      question: Is behavior tracked over time and mapped to the matrix, with simulations running?
    - segment: enterprise
      approach: A human-risk team runs integrated telemetry, an ongoing simulation program, and standing controlled tests.
      practices:
        - Run integrated human-risk analytics.
        - Run an ongoing simulation program.
        - Keep a standing testing capability.
      question: Does a dedicated team manage matrix-mapped risk with continuous simulation and testing?
- level: 4
  name: Insider-Threat Detection
  posture: Watch for intent, not just error.
  description: >-
    With everyday risky behavior measured and falling, the program shifts to finding the needle in
    the haystack: the rare, high-fidelity signals that point to malicious intent rather than a
    mistake. It correlates behavior across sources to surface deliberate acts such as data theft,
    sabotage, or disabling controls, and runs an insider-threat process to investigate and respond.
    It delivers detection of the few malicious actors hidden in the noise, using counter-intelligence
    method within security operations.
  signals: Correlated data from the SOC and identity, DLP, and endpoint tools, plus HR context.
  tooling: SIEM, EDR, identity analytics, insider-threat case management.
  modes: [monitor, intervene]
  degrees: [intentional]
  counterIntel: Detection borrows counter-intelligence methods to spot a witting insider before they act.
  limitation: >-
    It works case by case. It does not yet deter or disrupt a deliberate threat, and it still
    trails the adversary.
  gate: Move from detection to investigation, disruption, and steady adaptation.
  tracks:
    - segment: mid-size
      approach: >-
        Managed detection and platform alerts feed a small group from IT, HR, and legal. External
        investigators are on call. This is a mid-size company's ceiling.
      practices:
        - Correlate insider signals from managed detection and the platform.
        - Triage cases with a cross-functional group.
        - Keep external investigators on retainer.
      question: Are signals correlated to flag malicious insiders, with a group that triages and can escalate?
    - segment: enterprise
      approach: A dedicated insider-threat team with its own analysts, monitoring, and case management.
      practices:
        - Run an insider-threat team with set triage and case handling.
        - Staff analysts who work intent patterns.
        - Run a measured response up to investigation.
      question: Does a dedicated insider-threat team correlate intent patterns and run a measured response?
- level: 5
  name: Proactive Human Risk Program
  posture: A program that learns and gets ahead of risk.
  description: >-
    A program that learns and improves. It runs continuous detection, response, and threat
    intelligence, and feeds every outcome back to re-tune controls and training. It investigates and
    disrupts deliberate insider threats rather than only detecting them. It delivers a defense that
    stays ahead of a changing threat, reached by few organizations.
  signals: Behavior, telemetry, threat intelligence, and incident outcomes, used to reset priorities continuously.
  tooling: Detection and response, threat intel, automation, case management.
  modes: [educate, evaluate, monitor, intervene]
  degrees: [unintentional, unaware, deceived, coerced, intentional]
  counterIntel: Operational counter-intelligence is one capability here, to investigate and disrupt recruitment.
  limitation: It needs resources and authority that only the largest organizations have.
  gate: null
  northStar: true
  tracks:
    - segment: enterprise
      approach: >-
        Continuous detection and response, threat hunting, and automation, with a standing
        counter-intelligence capability for investigations and law-enforcement work.
      practices:
        - Run continuous detection, response, and threat hunting.
        - Tune controls and training from incidents and threat intelligence.
        - Keep a counter-intelligence capability for investigations and disruption.
      question: Does the program continuously improve from what it learns, with CI that investigates and disrupts threats?
