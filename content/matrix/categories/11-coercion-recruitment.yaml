id: 11
name: Coercion & Recruitment
degreeId: complicit
mappedModels:
  - mice
  - cognitive-biases
insiderCategories:
  - departing-employee
  - witting-recruited
  - collusive
techniques:
  - id: 11-witting-recruitment-mice
    label: Witting recruitment (MICE)
    mitreId: null
    description: A target is knowingly recruited to act against their employer,
      motivated by money, ideology, coercion, or ego.
    detailedDescription: >-
      The classic intelligence recruitment model exploiting one of four motivators: money
      (financial pressure), ideology (political alignment), coercion (blackmail or threats),
      or ego (flattery, recognition, revenge against perceived slights). The target
      understands they are betraying their employer and chooses to proceed, often through
      gradual escalation that normalizes the betrayal.
    attackerBehavior: >-
      The adversary identifies vulnerabilities through profiling, establishes rapport and
      trust, gradually tests boundaries with small requests, and escalates commitment through
      a series of increasingly compromising acts that create mutual culpability and dependence.
    insiderBehavior: >-
      The employee rationalizes their actions through grievance, ideology, financial
      necessity, or fear, often believing they are serving a higher purpose, correcting
      an injustice, or protecting themselves from consequences while compartmentalizing
      the harm to their organization.
    prevention:
      - mode: educate
        action: Train staff on recruitment tactics and create awareness of vulnerability factors like financial stress, ideological extremism, and grievances.
      - mode: evaluate
        action: Conduct controlled integrity tests and scenario simulations to identify personnel susceptible to recruitment approaches.
      - mode: monitor
        action: Implement behavioral analytics to detect changes in access patterns, financial stress indicators, ideological radicalization signals, and unusual contact patterns.
      - mode: intervene
        action: Launch manual counter-intelligence investigation with access containment, case-building for prosecution, and coordination with law enforcement or internal security teams.
  - id: 11-sextortion
    label: Sextortion
    mitreId: null
    description: Compromising sexual material is used to coerce the victim into cooperation.
    detailedDescription: >-
      Explicit sexual material — whether obtained through hacking, honey traps, or voluntary
      sharing — is leveraged to force compliance with adversary demands. The shame, legal
      concerns, and reputational damage create overwhelming pressure to cooperate, often
      escalating from small requests to major breaches as the victim becomes increasingly
      trapped.
    attackerBehavior: >-
      The adversary obtains compromising material through seduction, theft, or social
      engineering, then reveals possession gradually to establish psychological control
      before making specific demands, often starting small to normalize compliance and
      build toward larger objectives.
    insiderBehavior: >-
      The victim feels trapped between exposure and betrayal, often believing they can
      satisfy the demands and end the coercion, while experiencing shame, fear, and
      isolation that prevents them from seeking help or reporting the situation.
    prevention:
      - mode: educate
        action: Provide awareness training on sextortion tactics, victim support resources, and the importance of reporting rather than complying with demands.
      - mode: evaluate
        action: Test employee responses to simulated compromise scenarios and their knowledge of reporting channels for coercion situations.
      - mode: monitor
        action: Monitor for signs of personal distress, unusual access patterns, and behavioral changes that may indicate an employee is under duress.
      - mode: intervene
        action: Conduct discrete investigation to verify coercion, provide victim support and protection, contain access immediately, and coordinate with law enforcement for criminal prosecution.
  - id: 11-honey-trap-leverage-phase
    label: Honey trap (leverage phase)
    mitreId: null
    description: A cultivated intimate relationship is turned into leverage to
      compel cooperation.
    detailedDescription: >-
      After establishing genuine emotional intimacy or dependency, the relationship is
      weaponized through threats of exposure, abandonment, or harm to the relationship.
      The target's emotional investment and fear of losing the connection create powerful
      leverage that can compel cooperation with requests that escalate over time.
    attackerBehavior: >-
      The adversary cultivates a seemingly authentic intimate relationship, builds emotional
      dependency and trust, then gradually introduces leverage through threats to the
      relationship or exposure of compromising interactions while maintaining the emotional
      connection to maximize control.
    insiderBehavior: >-
      The victim experiences torn loyalty between their genuine feelings and their
      organizational duties, often believing they are protecting the relationship or
      that their partner's requests are reasonable given their emotional bond.
    prevention:
      - mode: educate
        action: Train staff on relationship-based manipulation tactics and encourage disclosure of personal relationships that could create conflicts of interest.
      - mode: evaluate
        action: Conduct scenarios testing how employees handle requests from intimate partners for work-related information or access.
      - mode: monitor
        action: Track changes in behavior and access patterns that correlate with new personal relationships, especially those formed in professional or travel contexts.
      - mode: intervene
        action: Investigate suspected honey trap operations, immediately contain compromised access, provide victim support, and coordinate counter-intelligence response with law enforcement.
  - id: 11-family-coercion
    label: Family coercion
    mitreId: null
    description: Threats against the target's family are used to force cooperation.
    detailedDescription: >-
      Direct or implied threats of harm to family members create overwhelming pressure to
      comply with adversary demands. The protective instinct and fear for loved ones'
      safety override professional obligations and ethical considerations, creating a
      powerful coercive dynamic that can compel almost any behavior.
    attackerBehavior: >-
      The adversary identifies family vulnerabilities through surveillance or research,
      makes credible threats against specific family members, demonstrates capability
      through surveillance evidence or minor incidents, then leverages the fear to extract
      compliance with escalating demands.
    insiderBehavior: >-
      The victim prioritizes family safety above all other considerations, often believing
      they have no choice but to comply and that resistance would put loved ones at
      greater risk, while feeling isolated and unable to seek help.
    prevention:
      - mode: educate
        action: Provide awareness of family threat scenarios and emphasize that the organization will provide protection and support rather than punishment for victims.
      - mode: evaluate
        action: Test employee knowledge of threat reporting procedures and their understanding of available protective resources and support systems.
      - mode: monitor
        action: Watch for behavioral changes indicating distress, changes in family routines reported through security awareness, and unusual access or data handling patterns.
      - mode: intervene
        action: Immediately provide family protection resources, contain the employee's access, coordinate with law enforcement for threat assessment, and launch counter-intelligence investigation.
  - id: 11-immigration-visa-leverage
    label: Immigration / visa leverage
    mitreId: null
    description: A target's immigration or visa status is exploited as leverage for
      cooperation.
    detailedDescription: >-
      Vulnerabilities in immigration status — expired visas, questionable applications,
      family member status issues — are leveraged to compel cooperation through threats
      of deportation or legal consequences. The fear of losing legal status, employment,
      and established life creates powerful pressure to comply with demands.
    attackerBehavior: >-
      The adversary identifies immigration vulnerabilities through research or insider
      knowledge, threatens exposure to authorities or sponsors, and leverages the target's
      fear of deportation or family separation to extract cooperation while maintaining
      the threat as ongoing leverage.
    insiderBehavior: >-
      The victim feels trapped between career destruction and potential deportation,
      often believing cooperation is temporary and necessary to protect their established
      life and family's future while feeling unable to risk exposure by seeking help.
    prevention:
      - mode: educate
        action: Provide clear guidance on immigration-related threat scenarios and ensure employees know that seeking help will not jeopardize their legitimate status.
      - mode: evaluate
        action: Test employee responses to scenarios involving threats related to their immigration status and knowledge of support resources.
      - mode: monitor
        action: Track behavioral changes that may indicate duress, particularly among employees with known immigration sensitivities, and monitor for unusual access patterns.
      - mode: intervene
        action: Verify immigration threats through legal counsel, provide immigration law support, contain compromised access, and coordinate investigation with appropriate authorities.
  - id: 11-direct-bribery
    label: Direct bribery
    mitreId: null
    description: The target is paid directly to act on the adversary's behalf.
    detailedDescription: >-
      Cash, cryptocurrency, valuable goods, or financial services are offered in exchange
      for specific actions or information. The transaction creates mutual culpability and
      an ongoing financial relationship that can be used for future leverage, often
      starting with small payments that gradually escalate in both amount and scope of required cooperation.
    attackerBehavior: >-
      The adversary identifies financial vulnerabilities or motivations, makes an initial
      offer that seems reasonable and low-risk, provides payment to establish the relationship,
      then gradually increases both compensation and requirements while using the established
      pattern of payment as leverage for continued cooperation.
    insiderBehavior: >-
      The employee rationalizes the initial payment as harmless or deserved compensation,
      often believing they can control the scope of cooperation and stop at any time,
      while becoming increasingly dependent on the income and aware of their vulnerability
      to exposure.
    prevention:
      - mode: educate
        action: Train staff on bribery approaches and financial reporting requirements, emphasizing that the organization will investigate fairly rather than punish reporting.
      - mode: evaluate
        action: Conduct integrity testing with simulated bribery attempts and assess employee knowledge of financial disclosure and reporting requirements.
      - mode: monitor
        action: Monitor for unexplained lifestyle changes, financial stress indicators, and unusual access patterns that may correlate with external financial incentives.
      - mode: intervene
        action: Investigate financial irregularities thoroughly, trace payment sources and methods, contain compromised access immediately, and coordinate with law enforcement for prosecution.
  - id: 11-whistleblower-channel-abuse
    label: Whistleblower-channel abuse
    mitreId: null
    description: Whistleblower or disclosure channels are abused to launder leaks or
      pressure the organization.
    detailedDescription: >-
      Legitimate whistleblower protections and disclosure channels are exploited to
      release selected information that serves adversary interests rather than genuine
      public benefit. The legal protections and moral authority of whistleblowing
      provide cover for intelligence operations or competitive attacks disguised as
      principled disclosure.
    attackerBehavior: >-
      The adversary identifies or recruits someone with legitimate access, frames requests
      in terms of public interest or ethical obligation, provides selective information
      that supports a particular narrative, and uses formal disclosure channels to
      legitimize and protect the leak operation.
    insiderBehavior: >-
      The employee believes they are serving a legitimate public interest or exposing
      genuine wrongdoing, often unaware that their information is being selectively
      used to support an adversary agenda rather than broad transparency or reform.
    prevention:
      - mode: educate
        action: Train staff on the difference between legitimate whistleblowing and adversary influence operations that exploit disclosure channels.
      - mode: evaluate
        action: Test employee understanding of proper disclosure channels and their ability to distinguish legitimate ethical concerns from manipulation.
      - mode: monitor
        action: Monitor disclosure patterns for unusual timing, selective information, or coordination with external events that may indicate orchestrated campaigns.
      - mode: intervene
        action: Investigate suspected abuse through counter-intelligence analysis, assess the employee's motivations and knowledge, and coordinate with legal and law enforcement as appropriate.
  - id: 11-hack-and-leak-operations
    label: Hack-and-leak operations
    mitreId: null
    description: Stolen data is selectively released to damage, pressure, or influence.
    detailedDescription: >-
      Data obtained through technical compromise is strategically released to maximize
      organizational damage, influence decisions, or pressure specific individuals. The
      timing, selection, and framing of releases are carefully orchestrated to achieve
      maximum impact while often involving insider knowledge to identify the most damaging materials.
    attackerBehavior: >-
      The adversary combines technical intrusion with insider intelligence to identify
      high-value targets, selects and contextualizes material for maximum damage, times
      releases for strategic impact, and often uses insider perspectives to authenticate
      or interpret the leaked material.
    insiderBehavior: >-
      The insider provides context, authentication, or guidance on the most damaging
      material to release, often believing they are exposing genuine wrongdoing or
      serving a justified cause while helping maximize the operational impact.
    prevention:
      - mode: educate
        action: Train staff on how to recognize and report approaches seeking context or guidance about internal data, communications, or organizational vulnerabilities.
      - mode: evaluate
        action: Conduct simulations testing employee responses to requests for information that could enable more effective hack-and-leak operations.
      - mode: monitor
        action: Monitor for unusual data access patterns, especially searches through historical communications or sensitive documents that lack clear business justification.
      - mode: intervene
        action: Launch immediate forensic investigation to trace data access and potential exfiltration, contain affected systems, and coordinate counter-intelligence response with law enforcement.
  - id: 11-strategic-leaking
    label: Strategic leaking
    mitreId: null
    description: An insider leaks information deliberately to advance an adversary's aims.
    detailedDescription: >-
      Specific information is deliberately disclosed to media, competitors, or other
      parties to achieve strategic objectives like market manipulation, policy influence,
      or operational disruption. The insider acts with full knowledge of the adversary's
      goals and times disclosures for maximum strategic impact rather than general transparency.
    attackerBehavior: >-
      The adversary identifies high-value intelligence targets, recruits or directs
      an insider with appropriate access, provides specific intelligence requirements
      and timing guidance, and coordinates the leak with broader influence operations
      or strategic objectives.
    insiderBehavior: >-
      The employee deliberately selects and times disclosures to serve specific adversary
      objectives, often believing they are advancing a legitimate cause or justified
      agenda while fully understanding the strategic nature of their cooperation.
    prevention:
      - mode: educate
        action: Provide training on the strategic use of leaks by adversaries and the difference between legitimate transparency and strategic information warfare.
      - mode: evaluate
        action: Test employee understanding of proper information sharing policies and their ability to recognize requests for strategically timed disclosures.
      - mode: monitor
        action: Monitor for patterns in information access and external communications that may indicate coordination with strategic disclosure campaigns.
      - mode: intervene
        action: Investigate strategic leak patterns through counter-intelligence analysis, trace communication channels and coordination, and coordinate prosecution with law enforcement.
  - id: 11-ransomware-extortion-post-se
    label: Ransomware extortion (post-SE)
    mitreId: null
    description: After social-engineered access, data is encrypted or stolen and the
      victim is extorted.
    detailedDescription: >-
      Following successful social engineering that establishes initial access, adversaries
      deploy ransomware or exfiltrate sensitive data to create leverage for ongoing
      extortion. The victim faces ongoing pressure to provide additional access, information,
      or payments under threat of data release or continued system disruption.
    attackerBehavior: >-
      The adversary uses social engineering to gain initial access, deploys ransomware
      or exfiltrates sensitive data, then leverages the compromise to demand ongoing
      cooperation rather than one-time payment, using the continued threat as a mechanism
      for sustained access.
    insiderBehavior: >-
      The victim initially believes they made a simple mistake that led to compromise,
      then faces escalating demands that transform them from victim to reluctant accomplice
      as they provide additional access or information under ongoing threat.
    prevention:
      - mode: educate
        action: Train staff that ransomware incidents should be reported immediately rather than handled privately, and that ongoing demands require security intervention.
      - mode: evaluate
        action: Test employee responses to simulated ransomware scenarios and their knowledge of proper incident reporting and escalation procedures.
      - mode: monitor
        action: Monitor for signs of ongoing compromise, unusual access patterns following security incidents, and behavioral changes indicating continued duress.
      - mode: intervene
        action: Treat ongoing extortion as active threat, immediately contain affected access, provide victim support, and coordinate with law enforcement for criminal investigation.
  - id: 11-blackmail-w-fabricated-material
    label: Blackmail w/ fabricated material
    mitreId: null
    description: Fabricated compromising material is used to blackmail the target
      into cooperation.
    detailedDescription: >-
      Deepfake technology, manipulated images, fabricated documents, or staged scenarios
      create convincing but false compromising material that can be used for blackmail.
      The realistic nature of fabricated evidence and the difficulty of proving innocence
      create effective leverage for forcing cooperation even when the underlying material is entirely false.
    attackerBehavior: >-
      The adversary creates convincing fabricated evidence using available technology
      and information about the target, presents the material as authentic with threats
      of exposure, and leverages the victim's inability to quickly prove fabrication
      to establish immediate control and compliance.
    insiderBehavior: >-
      The victim faces the impossible task of proving a negative, often believing that
      even if they could eventually demonstrate fabrication, the immediate damage to
      their reputation and relationships would be irreversible, leading them to comply
      with demands.
    prevention:
      - mode: educate
        action: Provide awareness of deepfake and fabrication techniques, emphasizing that fabricated blackmail should be reported for technical analysis rather than handled privately.
      - mode: evaluate
        action: Test employee responses to scenarios involving potentially fabricated compromising material and their knowledge of technical verification resources.
      - mode: monitor
        action: Monitor for behavioral changes indicating distress and establish channels for confidential reporting of suspected blackmail attempts.
      - mode: intervene
        action: Provide immediate technical analysis to verify authenticity, offer victim protection and support, contain access if compromised, and pursue criminal investigation of fabrication and extortion.
  - id: 11-hostage-of-data-leak-threat
    label: Hostage-of-data (leak threat)
    mitreId: null
    description: Stolen data is held over the victim with the threat of release to
      coerce payment or action.
    detailedDescription: >-
      Previously exfiltrated sensitive data — personal information, business secrets,
      communications, or other compromising material — is held as leverage to force
      ongoing cooperation or payment. The threat of selective or complete data release
      creates sustained pressure that can be used for long-term control rather than
      one-time extortion.
    attackerBehavior: >-
      The adversary demonstrates possession of valuable or damaging data, provides
      samples to establish credibility, threatens strategic release timed for maximum
      damage, and uses the ongoing threat as leverage for sustained cooperation or
      repeated payments rather than single transaction.
    insiderBehavior: >-
      The victim weighs the certain damage of data release against the possibility
      of satisfying demands and ending the threat, often believing they can manage
      the situation privately while providing incremental cooperation to prevent
      escalation or exposure.
    prevention:
      - mode: educate
        action: Train staff that data theft and extortion should be reported immediately as security incidents rather than handled as private matters.
      - mode: evaluate
        action: Test employee knowledge of data incident reporting procedures and their understanding that cooperation with extortion typically leads to escalation.
      - mode: monitor
        action: Monitor for data exfiltration patterns, unusual access to sensitive information, and behavioral changes that may indicate ongoing extortion.
      - mode: intervene
        action: Treat data extortion as active threat requiring immediate incident response, forensic analysis of data theft, access containment, and coordination with law enforcement.
  - id: 11-insider-data-theft-bulk-exfiltration
    label: Insider data theft / bulk exfiltration
    mitreId: null
    description: A witting insider copies sensitive data out — personal cloud, email-to-self, USB, screenshots — for gain or a third party.
    detailedDescription: >-
      An employee who has chosen to act against the organization uses their legitimate
      access to remove sensitive data in bulk, routing it through personal cloud storage,
      webmail, removable media, printing, or screen capture. Unlike an accidental leak, the
      act is deliberate and usually staged to look like normal work.
    attackerBehavior: >-
      An external sponsor or competitor receiving the data directs collection priorities and
      provides exfiltration channels, treating the insider as a tasked, trusted collector
      inside the perimeter.
    insiderBehavior: >-
      The insider rationalizes the theft — owed compensation, a grievance, loyalty elsewhere
      — and deliberately blends the exfiltration into routine activity to avoid detection.
    prevention:
      - mode: educate
        action: Set clear acceptable-use and data-ownership expectations and make lawful reporting and exit obligations unambiguous.
      - mode: evaluate
        action: Use counter-intelligence-style integrity tests and red-team exfiltration exercises to probe whether bulk theft is detectable.
      - mode: monitor
        action: Ingest DLP, UEBA, and egress signals for bulk downloads, anomalous access, and movement to personal channels, especially around resignations.
      - mode: intervene
        action: Open a discreet investigation with access containment and forensic preservation, and coordinate with legal and law enforcement for prosecution.
  - id: 11-ip-theft-on-departure
    label: IP / trade-secret theft on departure
    mitreId: null
    description: A departing employee takes source code, customer lists, or designs to a competitor or new venture.
    detailedDescription: >-
      In the window around resignation, an employee copies proprietary assets — code,
      schematics, pricing, customer and pipeline data — intending to use them at a competitor
      or their own startup. The behavior clusters near notice periods and offer acceptances
      and is often framed by the insider as taking "their own" work.
    attackerBehavior: >-
      A competitor or new employer benefits from and may quietly solicit the stolen material,
      gaining a market advantage built on another organization's protected IP.
    insiderBehavior: >-
      The departing employee feels ownership over work they produced and convinces themselves
      that taking it is fair, downloading or forwarding assets before handing back access.
    prevention:
      - mode: educate
        action: Remind staff at hire and exit of IP ownership, trade-secret obligations, and what they may not take with them.
      - mode: evaluate
        action: Review departure-window activity patterns and test whether offboarding catches pre-resignation data hoarding.
      - mode: monitor
        action: Heighten DLP/UEBA monitoring of repositories, CRM, and design stores during notice periods and on flight-risk signals.
      - mode: intervene
        action: Investigate suspected IP theft, preserve evidence, revoke access immediately, and pursue legal remedies and law-enforcement referral.
  - id: 11-sabotage-data-system-destruction
    label: Sabotage — data/system destruction
    mitreId: T1485
    description: An aggrieved or recruited insider intentionally deletes or corrupts data or systems.
    detailedDescription: >-
      A witting insider uses their access to destroy or corrupt data, wipe systems, or
      degrade services on purpose — out of revenge, on behalf of a sponsor, or to cause
      maximum disruption. Because the access is legitimate, the damage can be wide and fast
      before controls react.
    attackerBehavior: >-
      An external actor may task or pay the insider to time destruction with a
      business-critical moment, amplifying impact beyond what an outside attacker could reach.
    insiderBehavior: >-
      The insider, often after a grievance or termination notice, decides to do damage and
      uses familiar systems and timing to make the destruction effective.
    prevention:
      - mode: educate
        action: Reinforce a speak-up culture and lawful grievance channels so disputes are raised before they escalate to harm.
      - mode: evaluate
        action: Test destructive-action detection and recovery readiness through controlled exercises and tabletop scenarios.
      - mode: monitor
        action: Alert on mass-delete, mass-encrypt, and destructive admin actions, with tighter watch on privileged and notice-period users.
      - mode: intervene
        action: Contain access immediately, invoke incident response and recovery, preserve forensic evidence, and coordinate with law enforcement.
  - id: 11-inhibit-recovery-delete-backups
    label: Inhibit recovery / delete backups
    mitreId: T1490
    description: An insider destroys or disables backups and snapshots to maximize damage or force payment.
    detailedDescription: >-
      Alongside or ahead of sabotage or extortion, a witting insider targets the recovery
      path — deleting backups, disabling snapshots, revoking restore permissions, or
      corrupting replicas — so the organization cannot bounce back. Insider knowledge of
      where backups live makes this far more effective than an outsider's attempt.
    attackerBehavior: >-
      A ransomware crew or sponsor leverages the insider to neutralize backups first,
      converting a recoverable incident into a forced-payment or total-loss scenario.
    insiderBehavior: >-
      The insider applies their operational knowledge to quietly weaken recovery before
      acting, presenting backup changes as routine maintenance.
    prevention:
      - mode: educate
        action: Establish that backup and recovery systems are protected assets and changes follow strict, witnessed procedures.
      - mode: evaluate
        action: Test backup immutability and restore integrity, including attempts to tamper with recovery from privileged accounts.
      - mode: monitor
        action: Alert on backup deletion, snapshot disablement, and retention or permission changes, separating these duties from primary admins.
      - mode: intervene
        action: Freeze the implicated accounts, fail over to immutable or offline copies, and launch investigation with law-enforcement coordination.
  - id: 11-logic-bomb-delayed-trigger-sabotage
    label: Logic bomb / delayed-trigger sabotage
    mitreId: null
    description: An insider plants code or automation that triggers damage later, often after termination.
    detailedDescription: >-
      A technical insider embeds dormant logic — a scheduled job, conditional script, or
      booby-trapped change — set to corrupt data or disrupt systems at a future date or on a
      trigger such as their account being disabled. The delay distances the act from the
      perpetrator and can detonate after they have left.
    attackerBehavior: >-
      A sponsor may commission delayed sabotage to activate after the insider's departure,
      preserving deniability and timing impact for maximum effect.
    insiderBehavior: >-
      Anticipating a grievance or exit, the insider plants the mechanism in advance and
      conceals it within legitimate-looking code or configuration.
    prevention:
      - mode: educate
        action: Make clear that planting unauthorized automation is a serious offense and reinforce lawful avenues for disputes.
      - mode: evaluate
        action: Use code review, change audits, and integrity checks to probe for hidden triggers and unauthorized scheduled tasks.
      - mode: monitor
        action: Inventory scheduled tasks, triggers, and code changes; alert on anomalous or undocumented automation, especially from departing staff.
      - mode: intervene
        action: Isolate and analyze suspect code, remove the trigger, preserve evidence, and pursue investigation and prosecution.
  - id: 11-rogue-account-backdoor-persistence
    label: Rogue account / backdoor for persistence
    mitreId: T1136
    description: An insider creates hidden accounts or access paths to retain entry after leaving.
    detailedDescription: >-
      A witting insider provisions unauthorized accounts, API keys, service principals, or
      remote-access paths — or plants credentials — to keep access after their own is
      revoked. The backdoor lets them, or a sponsor, return quietly once they are no longer
      an employee.
    attackerBehavior: >-
      An external actor uses the insider-created account or key as durable, low-profile
      access into the environment, bypassing the scrutiny a fresh intrusion would draw.
    insiderBehavior: >-
      The insider sets up the alternate access ahead of departure, disguising it as a
      legitimate service or test account so it survives offboarding.
    prevention:
      - mode: educate
        action: Reinforce that creating undisclosed accounts or access paths is prohibited and offboarding will reconcile all access.
      - mode: evaluate
        action: Audit account-creation and access-grant trails and red-team for orphaned or hidden persistence after simulated departures.
      - mode: monitor
        action: Alert on out-of-process account or key creation and reconcile every identity against an authoritative owner, especially at exit.
      - mode: intervene
        action: Disable discovered rogue access, investigate its origin and use, and coordinate with law enforcement where warranted.
  - id: 11-selling-access-or-credentials
    label: Selling access or credentials
    mitreId: null
    description: An insider sells VPN, cloud, or application access or credentials to an external actor.
    detailedDescription: >-
      A witting insider monetizes their access by selling working credentials, VPN or cloud
      footholds, or session tokens to brokers or ransomware affiliates. The insider becomes
      an initial-access vendor, handing outsiders a trusted starting point inside the
      perimeter.
    attackerBehavior: >-
      Initial-access brokers and ransomware crews recruit and pay insiders for working
      access, then use or resell it to launch intrusions that look like legitimate logins.
    insiderBehavior: >-
      Motivated by money, the insider treats their access as a sellable asset and may be
      solicited through forums, messaging apps, or direct approaches.
    prevention:
      - mode: educate
        action: Raise awareness that insiders are actively recruited to sell access, and make reporting solicitations easy and rewarded.
      - mode: evaluate
        action: Run counter-intelligence-style sting and integrity tests and watch for recruitment approaches targeting staff.
      - mode: monitor
        action: Watch for credential sharing, anomalous logins from new locations or devices, and dark-web mentions of corporate access.
      - mode: intervene
        action: Contain compromised access, investigate the transaction, and coordinate with law enforcement on the insider and the buyer.
  - id: 11-privilege-abuse-snooping
    label: Privilege abuse / unauthorized snooping
    mitreId: null
    description: An insider uses legitimate access to browse, exfiltrate, or stalk data beyond any business need.
    detailedDescription: >-
      An insider with broad access misuses it for personal ends — looking up colleagues,
      VIPs, or exes; pulling records to sell; or satisfying curiosity. Each action is
      individually "authorized," so abuse hides in legitimate access unless need-to-know is
      enforced and reviewed.
    attackerBehavior: >-
      A buyer of personal data or a party seeking leverage may pay or pressure the insider to
      look up specific individuals, turning routine access into targeted collection.
    insiderBehavior: >-
      The insider treats their access as a personal privilege, viewing records they have no
      business reason to see and assuming no one is watching individual lookups.
    prevention:
      - mode: educate
        action: Make need-to-know explicit and remind staff that access is logged and personal use of records is prohibited.
      - mode: evaluate
        action: Test access governance with least-privilege reviews and integrity checks for unjustified lookups of sensitive records.
      - mode: monitor
        action: Apply UEBA to detect out-of-pattern access to VIP, HR, or customer records and lookups with no associated work item.
      - mode: intervene
        action: Investigate unjustified access, remove excess privilege, and escalate to HR, legal, or law enforcement based on intent and harm.
  - id: 11-log-tampering-covering-tracks
    label: Log tampering / covering tracks
    mitreId: T1070
    description: An insider disables logging or deletes audit trails to conceal malicious activity.
    detailedDescription: >-
      To hide theft, sabotage, or abuse, a witting insider manipulates the evidence —
      clearing logs, disabling auditing, altering timestamps, or excluding their activity
      from monitoring. Privileged access and knowledge of the logging pipeline make the
      cover-up more thorough than an outsider's.
    attackerBehavior: >-
      A sponsor benefits from the insider suppressing telemetry so the broader operation —
      collection or intrusion — proceeds without tripping detection or leaving a trail.
    insiderBehavior: >-
      The insider deliberately weakens or edits the audit trail around their actions, framing
      logging changes as maintenance or tuning.
    prevention:
      - mode: educate
        action: Establish that tampering with logs or monitoring is a serious offense and that audit integrity is protected.
      - mode: evaluate
        action: Test detection of log manipulation and verify that audit trails are tamper-evident under privileged misuse.
      - mode: monitor
        action: Ship logs off-host to append-only storage and alert on logging being disabled, cleared, or selectively modified.
      - mode: intervene
        action: Treat audit tampering as a strong indicator of insider activity; contain access, recover logs from immutable copies, and investigate with law enforcement.
  - id: 11-collusive-fraud-embezzlement
    label: Collusive fraud / embezzlement
    mitreId: null
    description: An insider manipulates financial records or systems for theft, often colluding with an outside party.
    detailedDescription: >-
      A witting insider abuses access to financial or business systems to divert funds,
      create fake vendors, approve fraudulent payments, or falsify records. It frequently
      involves collusion — with a colleague to defeat separation of duties, or with an
      external party who receives the proceeds.
    attackerBehavior: >-
      An external co-conspirator supplies fraudulent invoices, mule accounts, or shell
      vendors and splits the proceeds, relying on the insider to push transactions past
      controls.
    insiderBehavior: >-
      The insider exploits their knowledge of approval workflows and control gaps, structuring
      the fraud to look routine and, where needed, recruiting an accomplice to bypass
      separation of duties.
    prevention:
      - mode: educate
        action: Train staff on fraud schemes, separation-of-duties expectations, and confidential channels to report suspected collusion.
      - mode: evaluate
        action: Test financial controls and separation of duties with audits and integrity checks designed to surface collusion.
      - mode: monitor
        action: Analyze transactions for anomalies — new vendors, split approvals, round-dollar or off-hours payments — and reconcile against owners.
      - mode: intervene
        action: Investigate suspected fraud with finance and legal, preserve records, freeze implicated accounts, and coordinate with law enforcement.
  - id: 11-covert-exfiltration-channel
    label: Covert exfiltration channel (steganography / tunneling)
    mitreId: null
    description: A witting insider hides stolen data in images, DNS, or encrypted side-channels to defeat data-loss controls.
    detailedDescription: >-
      Rather than copy data out in the open, a deliberate insider conceals it — embedding
      files in images or documents (steganography), tunneling over DNS or HTTPS, encrypting
      and renaming, or smuggling small amounts over time. The goal is to move sensitive
      material past DLP and egress monitoring so the theft never trips a rule.
    attackerBehavior: >-
      A handler or buyer specifies low-and-slow, covert channels and may supply tooling, so
      the collection blends into normal traffic and evades the controls that catch overt
      transfers.
    insiderBehavior: >-
      The insider takes deliberate steps to avoid detection — staging, obfuscating, and timing
      the exfiltration — treating evasion as part of the task rather than an afterthought.
    prevention:
      - mode: educate
        action: Reinforce that deliberate evasion of data controls is a serious offense and that monitoring extends beyond obvious channels.
      - mode: evaluate
        action: Red-team covert exfiltration (steganography, DNS/HTTPS tunneling) to measure whether controls and analysts detect it.
      - mode: monitor
        action: Inspect for tunneling and anomalous egress — unusual DNS volume, encrypted blobs, off-hours transfers — and correlate with access to sensitive data.
      - mode: intervene
        action: Contain access and preserve forensic evidence on suspected covert exfiltration, and investigate with legal and law enforcement.
  - id: 11-clandestine-handler-communication
    label: Clandestine handler communication / dead drops
    mitreId: null
    description: A recruited asset uses covert channels and dead drops to receive tasking and pass material to a handler.
    detailedDescription: >-
      An insider working for an external sponsor uses tradecraft to communicate without being
      linked to them: burner devices, anonymized or encrypted apps, prearranged signals, and
      physical or digital dead drops where material is left for later pickup. The clandestine
      channel separates the act of collection from the act of handoff, frustrating
      attribution.
    attackerBehavior: >-
      The handler trains and equips the asset in communication security — schedules, fallback
      signals, drop sites, and burner infrastructure — to direct collection and retrieve
      material while keeping the relationship hidden.
    insiderBehavior: >-
      The insider maintains a second, secret set of devices and routines for contact, keeping
      the handler relationship strictly separated from their normal life and work.
    prevention:
      - mode: educate
        action: Build awareness of recruitment and handler tradecraft and make reporting suspicious approaches and contacts safe and expected.
      - mode: evaluate
        action: Use counter-intelligence-style assessments and insider-threat hunts to test whether covert contact and drops would be noticed.
      - mode: monitor
        action: Watch for indicators — unexplained second devices, anomalous travel or meetings, and access patterns paired with handoff opportunities.
      - mode: intervene
        action: Refer suspected clandestine contact to counter-intelligence, contain access discreetly, preserve evidence, and coordinate with law enforcement.
  - id: 11-third-party-contractor-access-abuse
    label: Trusted third-party / contractor access abuse
    mitreId: T1199
    description: A vendor, MSP, or contractor with legitimate access deliberately misuses it against the organization.
    detailedDescription: >-
      A third party granted standing access — a managed service provider, contractor,
      integrator, or vendor — abuses that trust to steal data, plant access, or act for a
      competitor or sponsor. Because the access is sanctioned and often broad and lightly
      monitored, the abuse is hard to distinguish from legitimate work, and it sits outside
      the organization's own HR and monitoring controls.
    attackerBehavior: >-
      An adversary targets or co-opts the trusted supplier — recruiting its staff or
      compromising the firm — to reach the real target through the legitimate connection,
      exploiting the trusted relationship rather than breaching the perimeter directly.
    insiderBehavior: >-
      The third-party individual uses access they were given for delivery to take or expose
      data beyond the engagement, knowing oversight of suppliers is usually weaker than for
      employees.
    prevention:
      - mode: educate
        action: Set explicit access, handling, and reporting obligations for vendors and contractors, and require their staff to acknowledge them.
      - mode: evaluate
        action: Assess third-party access against least-privilege in contracts and audits, and red-team the supplier path into sensitive systems.
      - mode: monitor
        action: Scope, log, and review third-party access separately, alerting on activity beyond the engagement's need-to-know.
      - mode: intervene
        action: Suspend the implicated third-party access, invoke contractual and legal remedies, investigate jointly, and coordinate with law enforcement.
  - id: 11-witting-security-control-circumvention
    label: Witting security-control circumvention
    mitreId: T1562
    description: A witting insider deliberately disables or weakens security controls to enable theft, sabotage, or outside access.
    detailedDescription: >-
      Ahead of or during a malicious act, an insider turns off the defenses — disabling EDR or
      DLP, creating monitoring exclusions, weakening firewall or MFA policy, or pausing
      logging — so their theft, sabotage, or an outside accomplice's intrusion proceeds
      unseen. Privileged access and knowledge of the control stack make the sabotage of
      defenses precise and credible as "maintenance."
    attackerBehavior: >-
      An external partner relies on the insider to blind specific controls at a chosen time,
      converting a hardened environment into an open one for the duration of the operation.
    insiderBehavior: >-
      The insider deliberately lowers defenses they are trusted to manage, framing the change
      as troubleshooting, tuning, or a temporary exception to avoid suspicion.
    prevention:
      - mode: educate
        action: Establish that disabling or weakening security controls outside change control is a serious offense, with clear sanctioned exception paths.
      - mode: evaluate
        action: Test detection of control tampering and verify that defensive changes require separation of duties and are tamper-evident.
      - mode: monitor
        action: Alert on disabled agents, new monitoring exclusions, and policy weakening, shipping those events off-host and watching privileged users closely.
      - mode: intervene
        action: Treat unexplained control changes as a strong insider indicator; contain access, restore controls, preserve evidence, and investigate with law enforcement.
