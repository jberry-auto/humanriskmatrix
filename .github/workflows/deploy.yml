name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Stays green until DigitalOcean is configured: with no DOCR_REGISTRY variable the
  # build job is skipped (neutral), not failed. We gate on this *variable* (readable
  # in every job) rather than DO_API_TOKEN, because that secret is scoped to the
  # `production` environment and is therefore only visible to the deploy job below.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          DOCR_REGISTRY: ${{ vars.DOCR_REGISTRY }}
        run: |
          if [ -n "$DOCR_REGISTRY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCR_REGISTRY variable not set — skipping deploy (configure DO to enable)."
          fi

  # Build the linux/amd64 image and push :latest to DOCR. The App Platform app has
  # image deploy-on-push enabled, so DigitalOcean redeploys automatically on push —
  # CI does not (and must not) run `doctl apps update`, which would overwrite the
  # live spec. Infra changes are made via `.do/app.yaml` + a manual `doctl apps update`.
  deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}
      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200
      - name: Build & push image
        env:
          REGISTRY: registry.digitalocean.com/${{ vars.DOCR_REGISTRY }}/hrm
        run: |
          docker build -t "$REGISTRY:${{ github.sha }}" -t "$REGISTRY:latest" .
          docker push "$REGISTRY:${{ github.sha }}"
          docker push "$REGISTRY:latest"
