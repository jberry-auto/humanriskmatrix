name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Keep `main` green until DigitalOcean is provisioned: if DO_API_TOKEN is unset,
  # the deploy job is skipped (neutral), not failed.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          if [ -n "$DO_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DO_API_TOKEN not set — skipping deploy (configure DO to enable)."
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}
      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200
      - name: Build & push image
        env:
          REGISTRY: registry.digitalocean.com/${{ vars.DOCR_REGISTRY }}/hrm
        run: |
          docker build -t "$REGISTRY:${{ github.sha }}" -t "$REGISTRY:latest" .
          docker push "$REGISTRY:${{ github.sha }}"
          docker push "$REGISTRY:latest"
      - name: Deploy to App Platform
        run: doctl apps update "${{ vars.DO_APP_ID }}" --spec .do/app.yaml --wait
