# DigitalOcean App Platform spec (docs/deployment-do.md).
# Deployed by .github/workflows/deploy.yml once DO is provisioned.
name: humanriskmatrix
region: nyc
services:
  - name: web
    image:
      registry_type: DOCR
      repository: hrm
      tag: latest
    http_port: 3000
    instance_size_slug: basic-xxs
    instance_count: 1
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 30
    envs:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
# Enable once DNS for humanriskmatrix.org points at the app (DO provisions TLS):
# domains:
#   - domain: humanriskmatrix.org
#     type: PRIMARY
