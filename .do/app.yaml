# DigitalOcean App Platform spec — mirrors the live app `human-risk-matrix-proj`.
#
# CI/CD: GitHub Actions (.github/workflows/deploy.yml) builds and pushes
# registry.digitalocean.com/human-risk-matrix-proj/hrm:latest. The service below has
# image deploy-on-push enabled, so DigitalOcean redeploys automatically on each push.
# To change infrastructure, edit this file and apply it once:
#   doctl apps update <APP_ID> --spec .do/app.yaml
name: human-risk-matrix-proj
region: nyc
domains:
  - domain: humanriskmatrix.org
    type: PRIMARY
services:
  - name: hrm
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    image:
      registry_type: DOCR
      registry: human-risk-matrix-proj
      repository: hrm
      tag: latest
      deploy_on_push:
        enabled: true
